<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SNG WEB BOT</title>
  <style>
    :root{--bg:#0d0d0d;--panel:#1a1a1a;--text:#ececec;--muted:#b4b4b4;--border:#2f2f2f;--accent:#10a37f;--danger:#ef4444}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif;display:flex;justify-content:center}
    .app{width:min(920px,100%);height:100vh;display:flex;flex-direction:column}
    .top{padding:14px 16px;border-bottom:1px solid var(--border);background:var(--panel);font-weight:700}
    .chat{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
    .msg{max-width:85%;padding:10px 12px;border-radius:12px;white-space:pre-wrap;line-height:1.4}
    .user{align-self:flex-end;background:#2563eb}
    .bot{align-self:flex-start;background:var(--panel);border:1px solid var(--border)}
    .typing{color:var(--muted);font-size:13px;padding:4px 2px}
    .bar{padding:12px;border-top:1px solid var(--border);display:flex;gap:8px;background:var(--panel)}
    textarea{flex:1;resize:none;min-height:48px;max-height:140px;padding:10px;border-radius:10px;border:1px solid var(--border);background:#111;color:var(--text)}
    button{min-width:90px;border:0;border-radius:10px;background:var(--accent);color:#fff;font-weight:600;cursor:pointer}
    button:disabled{opacity:.5;cursor:not-allowed}
    .hint{font-size:12px;color:var(--muted);padding:0 12px 10px}
    .err{color:var(--danger)}
  </style>
</head>
<body>
  <main class="app">
    <div class="top">SNG WEB BOT — Chat</div>
    <section id="chat" class="chat" aria-live="polite"></section>
    <div id="typing" class="typing" style="display:none">🤖 Réponse en cours...</div>
    <div class="bar">
      <textarea id="input" placeholder="Écris ton message..."></textarea>
      <button id="sendBtn" type="button">Envoyer</button>
    </div>
    <div class="hint">Entrée = envoyer • Shift+Entrée = saut de ligne</div>
  </main>

  <script>
    'use strict';
    const chat = document.getElementById('chat');
    const input = document.getElementById('input');
    const sendBtn = document.getElementById('sendBtn');
    const typing = document.getElementById('typing');

    function addMessage(role, text){
      const el = document.createElement('div');
      el.className = 'msg ' + (role === 'user' ? 'user' : 'bot');
      el.textContent = text;
      chat.appendChild(el);
      chat.scrollTop = chat.scrollHeight;
    }

    async function sendMessage(){
      const message = (input.value || '').trim();
      if(!message) return;
      input.value = '';
      input.style.height = '48px';
      addMessage('user', message);
      sendBtn.disabled = true;
      typing.style.display = 'block';

      try{
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({message})
        });
        const data = await res.json().catch(() => ({}));
        if(!res.ok || data.ok === false){
          throw new Error(data.error || 'Erreur serveur');
        }
        addMessage('bot', data.reply || '(vide)');
      }catch(err){
        addMessage('bot', '❌ Erreur: ' + (err && err.message ? err.message : 'inconnue'));
      }finally{
        typing.style.display = 'none';
        sendBtn.disabled = false;
      }
    }

    sendBtn.addEventListener('click', sendMessage);
    input.addEventListener('keydown', (e) => {
      if(e.key === 'Enter' && !e.shiftKey){
        e.preventDefault();
        sendMessage();
      }
    });
    input.addEventListener('input', () => {
      input.style.height = '48px';
      input.style.height = Math.min(input.scrollHeight, 140) + 'px';
    });
  </script>
</body>
</html>
